name: Build Xiaomi Pad 5 Pro WiFi (elish) (QGKI 4.19 + SukiSU-Ultra + SUSFS)

on:
  workflow_call:
  workflow_dispatch:

env:
  # Device env
  DEVICE_NAME : "xiaomi_elish"
  DEVICE_CODENAME : "elish"

  # NOTE: elish QGKI 4.19 top Makefile hardcodes `CLANG_FLAGS += -no-integrated-as`,
  # so clang MUST find an external GNU as for --target. Keep CLANG_TRIPLE as the
  # GNU triple (an android triple is rejected by scripts/clang-android.sh -> __ANDROID__).
  # The bundled android-4.9 gcc is prefixed aarch64-linux-android-, so we create
  # aarch64-linux-gnu-* symlinks in a step below and put gcc-64/bin on PATH (see
  # build-process) so `which $(CROSS_COMPILE)elfedit` resolves and clang --prefix finds
  # the GNU as. The -no-integrated-as flag itself is dropped globally and re-added only
  # for hand-written .S rules (see "Extra Kernel Options").
  # LLVM_IAS is a 5.x var and is ignored by this 4.19 tree, so it cannot be relied on.
  CUSTOM_CMDS : "CLANG_TRIPLE=aarch64-linux-gnu-"
  # P0 bisect: drop LLVM=1 so 4.19 falls back to GNU ld from the bundled gcc-4.9 tools.
  # Keep the stpcpy workaround unchanged so this run isolates the linker variable only.
  EXTRA_CMDS : "KCFLAGS=-fno-builtin-stpcpy"

  # MiCode elish source is QGKI 4.19.113 (Android R) only; the device ships Android 13
  # (MIUI V816.0.2.0.TKYCNXM) on 4.19.157-perf-gf8cf95f4dc15. Android-R kernel + A13
  # ramdisk/firmware = boot logo loop. Switch to UtsavBalar1231's CLO rebase
  # (4.19.268 + AOSP android-4.19-stable) which targets A13/A14 MIUI and keeps elish DT.
  KERNEL_SOURCE : "https://github.com/UtsavBalar1231/kernel_xiaomi_sm8250.git"
  KERNEL_BRANCH : "android13-stable"

  # LLVM 14.0.6 = QGKI factory (A11/A12) generation toolchain for kona, required by
  # techpack/audio (SND_SOC) + techpack/video (MEDIA). LLVM >= 19 turns their warnings
  # into -Werror errors. NOTE: the old URL "LLVM-14.0.6-Linux-X64.tar.xz" does NOT exist
  # under llvmorg-14.0.6 (HTTP 404 -> build-env "tar: This does not look like a tar
  # archive"). The actual amd64 Linux asset is "clang+llvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz"
  # (verified: 200 OK, valid xz, ~602 MB; extraction via --strip-components 1 works).
  CLANG_SOURCE : "https://github.com/llvm/llvm-project/releases/download/llvmorg-14.0.6/clang%2Bllvm-14.0.6-x86_64-linux-gnu-rhel-8.4.tar.xz"
  CLANG_BRANCH : ""

  # QGKI needs the Android-4.9 GNU GCC for CROSS_COMPILE (VDSO / host tools)
  GCC_GNU : false
  GCC_64_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/aarch64/aarch64-linux-android-4.9.git"
  GCC_64_BRANCH : "android12L-release"
  GCC_32_SOURCE : "https://android.googlesource.com/platform/prebuilts/gcc/linux-x86/arm/arm-linux-androideabi-4.9.git"
  GCC_32_BRANCH : "android12L-release"

  DEFCONFIG_SOURCE: ""
  DEFCONFIG_NAME : "elish_defconfig"
  DEFCONFIG_ORIGIN_IMAGE: ""
  DEFCONFIG_FROM_BOOT: false

  KERNELSU_SOURCE : ""
  KERNELSU_BRANCH : ""

  KERNELSU_AUTO_GET : "true"
  KERNELSU_AUTO_FORK : "sukisu" # xxksu, rsuntk, next, resukisu, sukisu

  SUSFS_ENABLE : true
  SUSFS_FIXED : true

  # Package kernel Image into a flashable AnyKernel3 zip (keeps current dtbo/ramdisk = most stable)
  AK3_SOURCE : "https://github.com/osm0sis/AnyKernel3.git"
  AK3_BRANCH : "master"

  BOOT_SOURCE : ""

  NEED_DTBO : false
  NEED_SAFE_DTBO : false

  ROM_TEXT : "suki_susfs_a11"

  # Other env
  PYTHON_VERSION: "3"

  PACK_METHOD: "Anykernel3"
  PACK_KMODULES: "false"

  KERNELSU_METHOD: "shell"

  PATCHES_SOURCE: "JackA1ltman/NonGKI_Kernel_Patches"
  PATCHES_BRANCH: "mi_kernel"

  # No pre-made kona fixed SUSFS patch in the patches repo yet -> keep blank to fall back to susfs_patch_to_4.19.patch
  SUSFS_FOLDER_FIXED: ""
  SUSFS_PATCH_FIXED: ""

  REKERNEL_ENABLE: "false"
  DROIDSPACES_ENABLE: "false"
  NOMOUNT_ENABLE: "false"

  HOOK_METHOD: "syscall"

  KERNEL_PATCH: "false"

  KPM_ENABLE: "false"
  KPM_INLINE: "false"
  KPM_KPATCH_NEXT: "false"
  KPM_PATCH_SOURCE: "https://raw.githubusercontent.com/SukiSU-Ultra/SukiSU_patch/refs/heads/main/kpm/patch_linux"

  BASEBAND_GUARD_ENABLE: "false"
  BASEBAND_GUARD_BOOT: "false"

  GENERATE_DTB: "false"
  GENERATE_CHIP: "qcom"

  BUILD_DEBUGGER: "false"
  SKIP_PATCH: "false"

  # elish_user_defconfig is a self-contained full defconfig -> no extra merge needed
  BUILD_OTHER_CONFIG: "false"
  MERGE_CONFIG_FILES: ""

  FREE_MORE_SPACE: "false"

jobs:
  build-kernel:
    name: Xiaomi Pad 5 Pro WiFi (elish) QGKI 4.19 + SukiSU + SUSFS
    runs-on: ubuntu-22.04
    env:
      CCACHE_COMPILERCHECK: "%compiler% -dumpmachine; %compiler% -dumpversion"
      CCACHE_NOHASHDIR: "true"
      CCACHE_HARDLINK: "true"

    steps:
      - name: ⏰ Checkout repository
        uses: actions/checkout@v6

      - name: ⌛️ Compilation environment preparation
        uses: ./.github/workflows/build-env

      - name: ⚙️ Get neccssary tools
        uses: ./.github/workflows/build-ready

      - name: 🔗 Add GNU-prefix as symlinks (clang external as)
        shell: bash
        run: |
          # The 4.19 elish Makefile forces `-no-integrated-as`, so clang locates the
          # external assembler as $(gcc-toolchain)/$(CLANG_TRIPLE-as) i.e.
          # aarch64-linux-gnu-as. The bundled android-4.9 gcc is unpacked with an
          # extra dir layer and only ships aarch64-linux-android-* names, so add
          # GNU-named symlinks so clang --prefix resolves them instead of falling
          # back to the x86 host /usr/bin/as (which rejects -EL).
          BIN="$GITHUB_WORKSPACE/gcc-64/bin"
          if [ ! -d "$BIN" ]; then
            echo "[-] gcc-64 bin dir not found: $BIN"
            find $GITHUB_WORKSPACE/gcc-64 -maxdepth 4 -type d | sed 's/^/  DIR: /' | head -40
            exit 1
          fi
          echo "[+] gcc-64 bin dir: $BIN"
          # Discover every android-named tool in the dir and mirror a gnu name.
          shopt -s nullglob
          for f in "$BIN"/aarch64-linux-android-*; do
            [ -e "$f" ] || continue
            base=$(basename "$f")
            gnu=${base/aarch64-linux-android-/aarch64-linux-gnu-}
            if [ "$gnu" != "$base" ] && [ ! -e "$BIN/$gnu" ]; then
              ln -sf "$base" "$BIN/$gnu"
              echo "  + $gnu -> $base"
            fi
          done
          # Guarantee the two binaries the Makefile probes exist.
          for t in as elfedit ld; do
            if [ ! -e "$BIN/aarch64-linux-gnu-$t" ]; then
              echo "  [-] missing aarch64-linux-gnu-$t"
            fi
          done
          echo "[done] GNU-prefix symlinks ready"

      - name: 🪝 Patch Kernel of SUSFS
        uses: ./.github/workflows/patch-susfs

      - name: 🔗 Patch for no-kprobe
        uses: ./.github/workflows/patch-no-kprobe

      - name: 🪛 Extra Kernel Options
        run: |
          cd $GITHUB_WORKSPACE/device_kernel

          # Host-tool fixes for this old 4.19 QGKI tree on modern CI runners.
          # 1) yylloc multiple-definition: upstream stable removed the redundant
          #    global `YYLTYPE yylloc;` in scripts/dtc/dtc-lexer.l (newer flex/bison
          #    + gcc -fno-common otherwise define the symbol in both lexer and parser).
          sed -i '/^YYLTYPE yylloc;$/d' ./scripts/dtc/dtc-lexer.l

          # 2) Split the assembler usage, because neither assembler works for everything:
          #    - The top Makefile force-adds `-no-integrated-as`, which routes EVERY .o to
          #      the bundled android-4.9 GNU as. That as (binutils 2.25) cannot parse
          #      clang-14 generated assembly (`file number less than one`,
          #      `junk at end of line` in init/do_mounts_rd.o) -> drop it globally so all
          #      clang-emitted .s uses clang's own integrated assembler (N-GKI/QGKI scheme).
          sed -i '/-no-integrated-as/d' ./Makefile
          #    - Hand-written .S files, however, use GNU-as-only syntax that llvm-mc
          #      rejects, e.g. arch/arm64/kernel/vdso/note.S (`BUILD_SALT` expands to
          #      ELFNOTE with empty section flags -> "changed section flags for
          #      .note.Linux, expected: 0x2") and `clock_gettime_return, shift=1`
          #      ("too many positional arguments"). Re-add `-no-integrated-as` for the
          #      .S -> .o rules only, so the vDSO stays byte-identical to the factory build.
          sed -i '/^cmd_as_o_S = /s|\$(CC)|$(CC) -no-integrated-as|' ./scripts/Makefile.build
          sed -i '/^ *cmd_vdsoas = /s|\$(CC)|$(CC) -no-integrated-as|' ./arch/arm64/kernel/vdso/Makefile

          # 3) Some vendor subsystems force their own *bare* `-Werror` (e.g.
          #    drivers/vservices/Makefile line 1 `ccflags-y += -Werror`). Xiaomi shipped
          #    elish with clang-8, which had no -Wunused-but-set-variable at all, so those
          #    drivers are clean on the factory toolchain but fatal here:
          #      drivers/vservices/session.c:1907: error: variable 'transport' set but not
          #      used [-Werror,-Wunused-but-set-variable]
          #    Downgrade only the bare flag; keep every targeted `-Werror=<name>` (implicit-int,
          #    strict-prototypes, incompatible-pointer-types, date-time, designated-init, ...)
          #    so real miscompilation-level bugs stay fatal.
          werror_files(){
            grep -rlE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild .
          }
          n_before=$(werror_files | wc -l)
          # The loop (tag a + ta) is required because the trailing whitespace is part of the
          # match, so a plain /g would skip an adjacent second '-Werror -Werror' occurrence.
          find . \( -name Makefile -o -name Kbuild \) -type f -print0 |
            xargs -0 -r sed -i -E ':a; s/(^|[[:space:]])-Werror([[:space:]]|$)/\1-Wno-error\2/; ta'
          n_after=$(werror_files | wc -l || true)
          echo "[+] bare -Werror downgraded in $n_before build file(s), $n_after remain."
          if [ "$n_after" != "0" ]; then
            echo "[-] unresolved bare -Werror occurrences:"
            grep -rnE '(^|[[:space:]])-Werror([[:space:]]|$)' --include=Makefile --include=Kbuild . | head -10
            exit 1
          fi

          # Keep stock toolchain-safe settings for QGKI 4.19 (kona) with modern clang
          echo "CONFIG_LTO_NONE=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_SHADOW_CALL_STACK=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_RELR=n" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

          # EROFS support (MIUI/EROFS system, harmless if unused)
          echo "CONFIG_EROFS_FS=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_EROFS_FS_ZIP=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_EROFS_FS_XATTR=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_EROFS_FS_POSIX_ACL=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}
          echo "CONFIG_EROFS_FS_SECURITY=y" >> ./arch/${{ env.KERNEL_ARCH }}/configs/${{ env.DEFCONFIG_NAME }}

      - name: 🧰 Patch Kernel of Re:Kernel
        uses: ./.github/workflows/patch-rekernel

      - name: 💿 Patch Kernel of Droidspaces
        uses: ./.github/workflows/patch-droidspaces

      - name: 🔒 Patch Kernel of Baseband Guard
        uses: ./.github/workflows/patch-baseband-guard

      - name: 🚀 Build Process
        uses: ./.github/workflows/build-process

      - name: 🔩 Pack Process
        uses: ./.github/workflows/pack-process

      - name: ✏️ Upload Artifacts
        uses: ./.github/workflows/upload-files
